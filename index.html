<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет курьера</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #333);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .price-info {
            background-color: #f0f8ff;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Отчет о доставке</h2>

    <div class="form-group">
        <label for="address">📍 Адрес доставки:</label>
        <input type="text" id="address" placeholder="Улица, дом, квартира">
    </div>

    <div class="form-group">
        <label for="delivered">🍾 Сдал полных бутылей:</label>
        <input type="number" id="delivered" value="1" min="1" oninput="calculateTotal()">
    </div>

    <div class="form-group">
        <label for="returned">🧴 Принял пустых бутылей:</label>
        <input type="number" id="returned" placeholder="Укажите кол-во" oninput="validateForm()">
    </div>

    <div class="price-info">
        Сумма к оплате: <span id="total-price">23 000</span> сум
    </div>

    <button id="send-btn" disabled onclick="sendReport()">Отправить отчет</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const PRICE_PER_BOTTLE = 23000;

    function calculateTotal() {
        const count = parseInt(document.getElementById('delivered').value) || 0;
        const total = count * PRICE_PER_BOTTLE;
        document.getElementById('total-price').innerText = total.toLocaleString('ru-RU');
        validateForm();
    }

    function validateForm() {
        const address = document.getElementById('address').value.trim();
        const delivered = document.getElementById('delivered').value;
        const returned = document.getElementById('returned').value;
        const btn = document.getElementById('send-btn');

        // Кнопка активна ТОЛЬКО если пустые бутыли заполнены (даже если 0) и адрес не пустой
        if (address !== "" && delivered !== "" && returned !== "") {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    document.getElementById('address').addEventListener('input', validateForm);

    function sendReport() {
        const data = {
            address: document.getElementById('address').value,
            delivered: document.getElementById('delivered').value,
            returned: document.getElementById('returned').value,
            total_price: parseInt(document.getElementById('delivered').value) * PRICE_PER_BOTTLE
        };
        tg.sendData(JSON.stringify(data));
        tg.close();
    }
</script>

</body>
</html>
