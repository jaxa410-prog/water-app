<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отчет о доставке воды</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      padding: 20px;
      margin: 0;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000);
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>📦 Отчет о доставке</h2>

  <form id="deliveryForm">
    <div class="form-group">
      <label for="address">📍 Адрес доставки:</label>
      <input type="text" id="address" placeholder="Улица, дом, квартира" required>
    </div>

    <div class="form-group">
      <label for="count">🍾 Количество бутылей:</label>
      <input type="number" id="count" min="1" value="1" required>
    </div>

    <button type="submit" id="submitBtn">Отправить отчет</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const form = document.getElementById('deliveryForm');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const address = document.getElementById('address').value;
      const count = document.getElementById('count').value;

      const payload = {
        address: address,
        count: count
      };

      // Отправляем данные боту и закрываем приложение
      tg.sendData(JSON.stringify(payload));
      tg.close();
    });
  </script>
</body>
</html>
